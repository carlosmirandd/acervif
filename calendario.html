<html lang="pt-BR" class="scroll-smooth">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { bgDark: '#050505', cyanAccent: '#00F0FF', purpleAccent: '#8A2BE2', slateMuted: '#A1A1AA' },
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: #FFFFFF; overflow-x: hidden; }
        .bg-grid {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }
        .glass-panel { background: rgba(20, 20, 20, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .text-gradient { background: linear-gradient(to right, #FFFFFF, #A1A1AA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .calendar-today { border: 1px solid #8A2BE2; box-shadow: inset 0 0 15px rgba(138, 43, 226, 0.2); }
        
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #8A2BE2; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased selection:bg-purpleAccent selection:text-white relative pb-20 min-h-screen">

    <div class="fixed inset-0 bg-grid -z-20 pointer-events-none"></div>
    <div class="fixed top-[-10%] right-[-5%] w-[600px] h-[600px] bg-purpleAccent rounded-full blur-[180px] opacity-[0.08] pointer-events-none -z-10 animate-float"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 sm:pt-16 relative z-10">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6 relative z-10 border-b border-white/10 pb-8">
            <div class="flex items-center group cursor-default">
                <div class="p-3 bg-white/5 rounded-2xl mr-4 border border-white/10 group-hover:scale-105 transition-transform">
                    <i data-lucide="calendar-days" class="w-8 h-8 text-purpleAccent drop-shadow-[0_0_8px_rgba(138,43,226,0.5)]"></i>
                </div>
                <div>
                    <h1 class="text-3xl sm:text-4xl font-bold tracking-tighter text-gradient leading-none">Calendário Acadêmico</h1>
                    <p class="font-mono text-sm text-slateMuted mt-1">IFRJ Niterói /// Eventos e Prazos 2026</p>
                </div>
            </div>
            
            <div class="flex gap-4">
                <a href="index.html" class="flex items-center gap-2 whitespace-nowrap glass-panel px-6 py-3 rounded-full font-mono text-sm font-bold text-slateMuted hover:bg-cyanAccent hover:text-bgDark transition-all">
                    <i data-lucide="database" class="w-4 h-4"></i> Acervo
                </a>
                <a href="comercios.html" class="flex items-center gap-2 whitespace-nowrap glass-panel px-6 py-3 rounded-full font-mono text-sm font-bold text-slateMuted hover:bg-pinkAccent hover:text-white transition-all">
                    <i data-lucide="store" class="w-4 h-4"></i> Comércios
                </a>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Calendário Principal -->
            <div class="lg:col-span-2 glass-panel rounded-3xl p-4 sm:p-8">
                <div class="flex justify-between items-center mb-8">
                    <button id="btnPrevMonth" class="p-3 glass-panel rounded-full hover:bg-white/10 transition-colors"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                    <h3 id="calendarMonthYear" class="text-2xl font-bold font-mono text-white tracking-widest uppercase">Mês Ano</h3>
                    <button id="btnNextMonth" class="p-3 glass-panel rounded-full hover:bg-white/10 transition-colors"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
                </div>
                
                <div class="grid grid-cols-7 gap-2 mb-4 text-center font-mono text-xs sm:text-sm text-slateMuted font-bold">
                    <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
                </div>
                
                <div id="calendarGrid" class="grid grid-cols-7 gap-2 sm:gap-3"></div>
            </div>

            <!-- Lista Lateral -->
            <div class="lg:col-span-1 glass-panel rounded-3xl p-6 sm:p-8 flex flex-col max-h-[800px]">
                <div class="mb-6 pb-6 border-b border-white/10">
                    <h3 class="text-xl font-bold mb-2 flex items-center">
                        <i data-lucide="list-todo" class="w-6 h-6 text-purpleAccent mr-3"></i> Eventos do Mês
                    </h3>
                    <p id="selectedMonthDisplay" class="font-mono text-sm text-slateMuted">Carregando...</p>
                </div>
                <div id="monthEventsList" class="flex-grow overflow-y-auto space-y-4 pr-2 scrollbar-hide">
                    <div id="loader" class="text-center py-10 font-mono text-slateMuted animate-pulse">Sincronizando...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module">

        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {

            storageBucket: "acervif12.firebasestorage.app",
            messagingSenderId: "698647384488",

            measurementId: "G-9C095VDTBG"

        let db;

        // PDF Data Completa
        const pdfEvents = [

            { start: '2026-02-02', end: '2026-02-02', title: 'Resultado da 2ª etapa de inscrição', color: 'bg-green-500' },

            // Mar

            { start: '2026-03-09', end: '2026-03-13', title: 'Aproveitamento de Estudos (Ingressante)', color: 'bg-blue-400' },
            { start: '2026-03-10', end: '2026-03-10', title: 'Resultado Aproveitamento', color: 'bg-blue-500' },
            // Abr

            { start: '2026-04-04', end: '2026-04-04', title: 'Recesso', color: 'bg-orange-500' },
            { start: '2026-04-21', end: '2026-04-21', title: 'Feriado (Tiradentes)', color: 'bg-red-500' },
            { start: '2026-04-22', end: '2026-04-22', title: 'Recesso', color: 'bg-orange-500' },
            { start: '2026-04-23', end: '2026-04-23', title: 'Feriado (São Jorge)', color: 'bg-red-500' },
            // Mai
            { start: '2026-05-01', end: '2026-05-01', title: 'Feriado (Dia do Trabalho)', color: 'bg-red-500' },
            { start: '2026-05-02', end: '2026-05-02', title: 'Recesso', color: 'bg-orange-500' },
            { start: '2026-05-11', end: '2026-05-15', title: 'Trancamento de curso', color: 'bg-slate-500' },
            { start: '2026-05-18', end: '2026-05-29', title: 'Aproveitamento de Estudos (Veterano)', color: 'bg-blue-400' },
            { start: '2026-05-18', end: '2026-05-31', title: 'Validação Atividades Complementares', color: 'bg-blue-500' },
            // Jun
            { start: '2026-06-03', end: '2026-06-06', title: 'Semana do Meio ambiente', color: 'bg-emerald-500' },
            { start: '2026-06-04', end: '2026-06-04', title: 'Feriado (Corpus Christi)', color: 'bg-red-500' },
            { start: '2026-06-12', end: '2026-06-12', title: 'Envio horários secretaria', color: 'bg-blue-500' },
            { start: '2026-06-22', end: '2026-06-26', title: 'Reabertura Matrícula / Disc. Isoladas', color: 'bg-slate-400' },
            { start: '2026-06-23', end: '2026-06-23', title: 'Dia Mulheres na Engenharia', color: 'bg-pink-500' },
            // Jul
            { start: '2026-07-02', end: '2026-07-16', title: 'Procedimentos Secretarias', color: 'bg-blue-500' },
            { start: '2026-07-13', end: '2026-07-13', title: 'Consolidação disciplinas SIGAA', color: 'bg-green-600' },
            { start: '2026-07-14', end: '2026-07-16', title: 'Retificação notas/frequências', color: 'bg-blue-400' },
            { start: '2026-07-16', end: '2026-07-16', title: 'Término Semestre 2026.1', color: 'bg-yellow-500 text-black' },
            { start: '2026-07-17', end: '2026-07-31', title: 'Férias Docentes', color: 'bg-orange-400' },
            { start: '2026-07-18', end: '2026-07-26', title: '1ª etapa Inscrição 2026.2', color: 'bg-green-500' },
            { start: '2026-07-28', end: '2026-07-28', title: 'Resultado 1ª etapa', color: 'bg-green-500' },
            { start: '2026-07-29', end: '2026-07-30', title: '2ª etapa Inscrição 2026.2', color: 'bg-green-500' },
            // Ago
            { start: '2026-08-03', end: '2026-08-03', title: 'Resultado 2ª etapa / Planejamento', color: 'bg-blue-400' },
            { start: '2026-08-04', end: '2026-08-04', title: 'Início Semestre 2026.2', color: 'bg-yellow-500 text-black' },
            { start: '2026-08-05', end: '2026-08-08', title: 'Semana ETC', color: 'bg-cyan-500' },
            { start: '2026-08-13', end: '2026-08-13', title: 'Resultado disc. isoladas', color: 'bg-green-500' },
            { start: '2026-08-17', end: '2026-08-21', title: 'Aproveitamento (Ingressante)', color: 'bg-blue-400' },
            { start: '2026-08-18', end: '2026-08-18', title: 'Resultado Aproveitamento', color: 'bg-blue-500' },
            // Set
            { start: '2026-09-07', end: '2026-09-07', title: 'Feriado (Independência)', color: 'bg-red-500' },
            { start: '2026-09-14', end: '2026-09-18', title: 'Trancamento Disciplinas', color: 'bg-slate-500' },
            // Out
            { start: '2026-10-05', end: '2026-10-06', title: 'Conselhos de Classe MV1', color: 'bg-blue-400' },
            { start: '2026-10-12', end: '2026-10-12', title: 'Feriado (Aparecida)', color: 'bg-red-500' },
            { start: '2026-10-15', end: '2026-10-15', title: 'Feriado (Professor)', color: 'bg-red-500' },
            { start: '2026-10-19', end: '2026-10-23', title: 'Trancamento de curso', color: 'bg-slate-500' },
            { start: '2026-10-26', end: '2026-11-06', title: 'Aproveitamento (Veterano)', color: 'bg-blue-400' },
            { start: '2026-10-26', end: '2026-11-13', title: 'Validação Atividades Complementares', color: 'bg-blue-500' },
            { start: '2026-10-28', end: '2026-10-28', title: 'Feriado (Servidor Público)', color: 'bg-red-500' },
            // Nov
            { start: '2026-11-02', end: '2026-11-02', title: 'Feriado (Finados)', color: 'bg-red-500' },
            { start: '2026-11-20', end: '2026-11-20', title: 'Feriado (Consciência Negra)', color: 'bg-red-500' },
            { start: '2026-11-21', end: '2026-11-21', title: 'Recesso', color: 'bg-orange-500' },
            // Dez
            { start: '2026-12-07', end: '2026-12-23', title: 'Procedimentos Secretarias', color: 'bg-blue-500' },
            { start: '2026-12-11', end: '2026-12-11', title: 'Dia do Engenheiro', color: 'bg-cyan-500' },
            { start: '2026-12-21', end: '2026-12-21', title: 'Consolidação SIGAA', color: 'bg-green-600' },
            { start: '2026-12-22', end: '2026-12-23', title: 'Retificação notas', color: 'bg-blue-400' },
            { start: '2026-12-23', end: '2026-12-23', title: 'Fim ano letivo 2026', color: 'bg-yellow-500 text-black' },
            { start: '2026-12-25', end: '2026-12-25', title: 'Feriado (Natal)', color: 'bg-red-500' },
            { start: '2026-12-26', end: '2026-12-31', title: 'Recesso', color: 'bg-orange-500' }
        ];

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        if(currentYear < 2026) { currentYear = 2026; currentMonth = 1; }

        const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        async function init() {
            lucide.createIcons();
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                await fetchDynamicEvents();
                document.getElementById('btnPrevMonth').onclick = () => changeMonth(-1);
                document.getElementById('btnNextMonth').onclick = () => changeMonth(1);
                renderCalendar();
            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerText = "Erro ao acessar.";
            }
        }

        async function fetchDynamicEvents() {
            try {
                const snap = await getDocs(collection(db, 'events'));
                adminEvents = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch(e) { console.error(e); }
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function formatDt(y, m, d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
        function formatBr(ds) { if(!ds) return ''; const [y,m,d] = ds.split('-'); return `${d}/${m}`; }
        function inRange(d, s, e) { return d >= s && d <= e; }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            document.getElementById('calendarMonthYear').innerText = `${monthNames[currentMonth]} ${currentYear}`;
            grid.innerHTML = '';
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();
            const isCM = today.getMonth() === currentMonth && today.getFullYear() === currentYear;
            const cd = today.getDate();

            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="aspect-square rounded-xl bg-white/5 opacity-50"></div>`;

            for (let i = 1; i <= daysInMonth; i++) {
                const dt = formatDt(currentYear, currentMonth, i);
                let dayEvents = [];
                pdfEvents.forEach(e => { if(inRange(dt, e.start, e.end)) dayEvents.push(e); });
                adminEvents.forEach(e => { if(inRange(dt, e.startDate, e.endDate)) dayEvents.push({...e, color:'bg-[#8A2BE2]'}); });
                
                let extra = "aspect-square rounded-xl glass-panel flex flex-col p-2 relative overflow-hidden transition-all";
                if (isCM && i === cd) extra += " calendar-today scale-105 z-10 font-bold";
                
                let barHTML = '';
                let iconsHTML = '';
                
                if (dayEvents.length > 0) {
                    const uColors = [...new Set(dayEvents.map(ev => ev.color.split(' ')[0]))]; 
                    barHTML = `<div class="absolute bottom-0 left-0 w-full h-2 flex">`;
                    uColors.forEach(color => barHTML += `<div class="flex-1 h-full ${color}"></div>`);
                    barHTML += `</div>`;

                    const dIcons = dayEvents.filter(ev => ev.iconUrl);
                    if (dIcons.length > 0) {
                        iconsHTML = `<div class="flex gap-1 flex-wrap justify-end">`;
                        dIcons.forEach(ev => iconsHTML += `<img src="${ev.iconUrl}" class="w-4 h-4 sm:w-5 sm:h-5 object-contain drop-shadow-[0_0_5px_rgba(255,255,255,0.3)]">`);
                        iconsHTML += `</div>`;
                    }
                }

                grid.innerHTML += `
                    <div class="${extra}">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-sm sm:text-base font-mono ${isCM && i === cd ? 'text-purpleAccent' : 'text-slate-300'}">${i}</span>
                            ${iconsHTML}
                        </div>
                        ${barHTML}
                    </div>
                `;
            }
            renderMonthlyList();
        }

        function renderMonthlyList() {
            const list = document.getElementById('monthEventsList');
            document.getElementById('selectedMonthDisplay').innerText = `Visualizando: ${monthNames[currentMonth]}`;
            list.innerHTML = '';

            const sMonth = formatDt(currentYear, currentMonth, 1);
            const eMonth = formatDt(currentYear, currentMonth, new Date(currentYear, currentMonth + 1, 0).getDate());

            let monthEvents = [];
            pdfEvents.forEach(e => { if (e.start <= eMonth && e.end >= sMonth) monthEvents.push({...e, s:'PDF'}); });
            adminEvents.forEach(e => { if (e.startDate <= eMonth && e.endDate >= sMonth) monthEvents.push({...e, color:'bg-[#8A2BE2]', s:'Admin', start:e.startDate, end:e.endDate}); });

            monthEvents.sort((a, b) => a.start.localeCompare(b.start));

            if (monthEvents.length === 0) {
                list.innerHTML = `<div class="flex flex-col items-center p-8 opacity-50"><i data-lucide="calendar-x" class="w-12 h-12 mb-4"></i><p class="font-mono text-sm text-center">Nenhum evento acadêmico neste período.</p></div>`;
                lucide.createIcons(); return;
            }

            monthEvents.forEach(ev => {
                const dFmt = (ev.start === ev.end) ? formatBr(ev.start) : `${formatBr(ev.start)} a ${formatBr(ev.end)}`;
                list.innerHTML += `
                    <div class="glass-panel p-4 rounded-xl border-l-4 group hover:bg-white/5 transition-colors border-transparent hover:border-current" style="color: ${ev.color.includes('bg-[#8A2BE2]') ? '#8A2BE2' : ''}">
                        <div class="flex items-start gap-3">
                            <div class="w-3 h-3 rounded-full mt-1.5 flex-shrink-0 ${ev.color} shadow-sm group-hover:scale-110"></div>
                            <div class="w-full">
                                <p class="font-bold text-sm sm:text-base leading-tight text-white mb-2">${ev.title}</p>
                                <div class="flex items-center justify-between">
                                    <span class="text-xs font-mono text-cyanAccent"><i data-lucide="calendar" class="w-3 h-3 inline mr-1"></i>${dFmt}</span>
                                    <span class="text-[10px] font-mono font-bold uppercase opacity-60">${ev.s === 'Admin' ? 'Personalizado' : 'Grade Oficial'}</span>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>

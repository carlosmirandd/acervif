        let adminEvents = [];
        let allEvents = [];
        let currentYear = 2026; 
        
        // Auto-abre no mês atual, ou em Agosto caso PC não esteja em 2026
        const todayReal = new Date();
        let currentMonth = todayReal.getFullYear() === 2026 ? todayReal.getMonth() : 7; 

        const grid = document.getElementById('calendarGrid');
        const monthLabel = document.getElementById('currentMonthLabel');
        const monthEventsList = document.getElementById('monthEventsList');

        async function init() {
            lucide.createIcons();
            try {
                const snap = await getDocs(collection(db, 'events'));
                adminEvents = snap.docs.map(d => ({id: d.id, color: '#7C3AED', ...d.data()})); 
            } catch(e) { console.error("Sem eventos remotos"); }
            
            allEvents = [...hardcodedEvents, ...adminEvents.map(e => ({ title: e.title, start: e.startDate, end: e.endDate, color: e.color, iconUrl: e.iconUrl }))];
            renderCalendar();
        }

        function getDatesInRange(startStr, endStr) {
            const arr = [];
            let curr = new Date(startStr + 'T12:00:00Z');
            let end = new Date(endStr + 'T12:00:00Z');
            while(curr <= end) { arr.push(curr.toISOString().split('T')[0]); curr.setDate(curr.getDate()+1); }
            return arr;
        }

        function renderCalendar() {
            grid.innerHTML = '';
            monthEventsList.innerHTML = '';
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
            monthLabel.innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const todayStr = `${todayReal.getFullYear()}-${String(todayReal.getMonth()+1).padStart(2,'0')}-${String(todayReal.getDate()).padStart(2,'0')}`;

            const daysMap = {};
            const eventsInThisMonth = [];
            
            allEvents.forEach(evt => {
                if(!evt.start || !evt.end) return;
                const dates = getDatesInRange(evt.start, evt.end);
                let addedToList = false;
                
                dates.forEach(dateStr => {
                    if(dateStr.startsWith(`${currentYear}-${String(currentMonth+1).padStart(2,'0')}`)) {
                        if(!daysMap[dateStr]) daysMap[dateStr] = [];
                        daysMap[dateStr].push(evt);
                        if(!addedToList) { eventsInThisMonth.push(evt); addedToList = true; }
                    }
                });
            });

            if(eventsInThisMonth.length === 0) {
                monthEventsList.innerHTML = '<div class="text-themeMuted p-2 text-center">Nenhum evento neste mês.</div>';
            } else {
                eventsInThisMonth.sort((a,b) => a.start.localeCompare(b.start));
                eventsInThisMonth.forEach(evt => {
                    const startArr = evt.start.split('-');
                    const endArr = evt.end.split('-');
                    let dateDisplay = `${startArr[2]}/${startArr[1]}`;
                    if(evt.start !== evt.end) dateDisplay += ` a ${endArr[2]}/${endArr[1]}`;
                    
                    monthEventsList.innerHTML += `
                        <div class="flex items-start border-l-2 pl-3 py-1" style="border-color: ${evt.color}">
                            <div class="flex-1">
                                <div class="font-bold text-textMain">${evt.title}</div>
                                <div class="text-themeMuted text-xs mt-1">${dateDisplay}</div>
                            </div>
                        </div>
                    `;
                });
            }

            for(let i=0; i<firstDay; i++) grid.innerHTML += `<div class="aspect-square bg-transparent rounded-xl border border-transparent"></div>`;

            for(let i=1; i<=daysInMonth; i++) {
                const dayStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const evts = daysMap[dayStr] || [];
                const isToday = dayStr === todayStr;
                
                const uniqueColors = [...new Set(evts.map(e => e.color))];
                const icons = evts.filter(e => e.iconUrl).map(e => e.iconUrl);

                let iconsHtml = '';
                if(icons.length > 0) iconsHtml = `<div class="absolute top-1 right-1 flex gap-1">${icons.map(url => `<img src="${url}" class="w-4 h-4 rounded-full object-cover shadow-sm bg-white">`).join('')}</div>`;

                let colorBarHtml = '';
                if(uniqueColors.length > 0) colorBarHtml = `<div class="absolute bottom-0 left-0 w-full h-1.5 flex">${uniqueColors.map(c => `<div class="flex-1" style="background-color: ${c}"></div>`).join('')}</div>`;

                const todayClass = isToday ? 'ring-2 ring-cyanAccent shadow-[0_0_15px_rgba(2,132,199,0.2)] bg-white dark:bg-[#111]' : 'border border-[var(--glass-border)] hover:border-purpleAccent/50 bg-white/50 dark:bg-black/50';

                grid.innerHTML += `
                    <div class="aspect-square rounded-xl ${todayClass} relative overflow-hidden flex items-center justify-center cursor-default transition-all">
                        <span class="${isToday ? 'font-bold text-cyanAccent' : 'font-semibold text-themeMuted'}">${i}</span>
                        ${iconsHtml}
                        ${colorBarHtml}
                    </div>
                `;
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => { currentMonth--; if(currentMonth<0){currentMonth=11;currentYear--;} renderCalendar(); });
        document.getElementById('nextMonth').addEventListener('click', () => { currentMonth++; if(currentMonth>11){currentMonth=0;currentYear++;} renderCalendar(); });

        init();
    </script>
</body>
</html>

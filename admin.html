<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcervIF | Terminal Administrativo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        themeBg: 'var(--bg-color)', 
                        textMain: 'var(--text-main)',
                        themeMuted: 'var(--text-muted)',
                        cyanAccent: 'var(--cyan-accent)', 
                        purpleAccent: 'var(--purple-accent)', 
                        pinkAccent: 'var(--pink-accent)' 
                    },
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #F8FAFC; --text-main: #0F172A; --text-muted: #64748B;
            --cyan-accent: #0284C7; --purple-accent: #7C3AED; --pink-accent: #DB2777;
            --glass-bg: rgba(255, 255, 255, 0.8); --glass-border: rgba(0, 0, 0, 0.08); --glass-shadow: rgba(0, 0, 0, 0.03);
            --input-bg: rgba(255, 255, 255, 0.9); --input-border: rgba(0, 0, 0, 0.15); --input-focus-bg: #FFFFFF;
            --grid-line: rgba(0, 0, 0, 0.04); --scroll-track: #F8FAFC; --scroll-thumb: #CBD5E1; --scroll-thumb-hover: #7C3AED;
        }

        .dark {
            --bg-color: #050505; --text-main: #FFFFFF; --text-muted: #A1A1AA;
            --cyan-accent: #00F0FF; --purple-accent: #8A2BE2; --pink-accent: #FF1493;
            --glass-bg: rgba(20, 20, 20, 0.4); --glass-border: rgba(255, 255, 255, 0.08); --glass-shadow: rgba(0, 0, 0, 0.3);
            --input-bg: rgba(255, 255, 255, 0.03); --input-border: rgba(255, 255, 255, 0.15); --input-focus-bg: rgba(255, 255, 255, 0.05);
            --grid-line: rgba(255, 255, 255, 0.03); --scroll-track: #050505; --scroll-thumb: #27272a; --scroll-thumb-hover: #8A2BE2;
        }

        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; transition: background-color 0.3s, color 0.3s; }
        .bg-grid { background-size: 50px 50px; background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px); }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); box-shadow: 0 4px 20px var(--glass-shadow); transition: background-color 0.3s, border-color 0.3s; }
        .glass-input { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); transition: all 0.3s; }
        .glass-input:focus { outline: none; border-color: var(--purple-accent); background: var(--input-focus-bg); box-shadow: 0 0 10px rgba(124, 58, 237, 0.1); }
        .text-gradient { background: linear-gradient(to right, var(--text-main), var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tab-btn { transition: all 0.3s; }
        .tab-btn.active { border-bottom-color: var(--purple-accent); color: var(--purple-accent); background-color: rgba(124, 58, 237, 0.05); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
    </style>
</head>
<body class="antialiased selection:bg-purpleAccent selection:text-white relative pb-20 min-h-screen">
    <div class="fixed inset-0 bg-grid -z-20 pointer-events-none transition-colors duration-300"></div>

    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 pt-10">
        
        <!-- Login -->
        <div id="loginSection" class="max-w-md mx-auto glass-panel rounded-3xl p-8 md:p-12 mt-10">
            <div class="text-center mb-8">

            <form id="loginForm" class="space-y-4">

                    <div>

                </div>

                            <button onclick="setTheme('dark')" class="w-full text-left px-4 py-2 text-sm font-mono text-themeMuted hover:text-textMain hover:bg-black/5 dark:hover:bg-white/5"><i data-lucide="moon" class="w-4 h-4 inline mr-2"></i> Escuro</button>
                            <button onclick="setTheme('system')" class="w-full text-left px-4 py-2 text-sm font-mono text-themeMuted hover:text-textMain hover:bg-black/5 dark:hover:bg-white/5"><i data-lucide="monitor" class="w-4 h-4 inline mr-2"></i> Sistema</button>

                    <a href="index.html" class="text-sm font-mono text-cyanAccent hover:underline py-2">Ver Site</a>
                    <button id="btnLogout" class="text-sm font-mono text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 py-2 px-4 rounded-lg">Sair</button>

            <div id="statusMessage" class="hidden mb-6 p-4 rounded-xl font-mono text-sm font-bold border"></div>

            <div class="flex border-b border-[var(--glass-border)] mb-8 overflow-x-auto scrollbar-hide">
                <button class="tab-btn active px-6 py-3 font-mono text-sm border-b-2 font-bold whitespace-nowrap" data-target="acervoTab"><i data-lucide="database" class="inline w-4 h-4 mr-2"></i>Acervo</button>

                            <div id="postBlogWrapper" class="hidden"><textarea id="postBlogContent" class="w-full glass-input rounded-lg p-3 text-sm min-h-[150px]" placeholder="Escreva todo o conteúdo aqui..."></textarea></div>

                            <label class="flex items-center text-sm text-themeMuted"><input type="checkbox" id="postPriority" class="mr-2 accent-cyanAccent">Destaque na Home</label>
                            
                            <div class="flex gap-2">
                                <button type="submit" id="btnPost" class="bg-cyanAccent text-white py-2 px-4 rounded-lg font-bold w-full">Salvar Post</button>

                </div>
            </div>

            <div id="comerciosTab" class="tab-content hidden">
                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 border-r border-[var(--glass-border)] pr-6">
                        <h3 class="font-bold mb-4 flex items-center text-pinkAccent"><i data-lucide="folder-plus" class="w-5 h-5 mr-2"></i> Categoria</h3>
                        <form id="comCatForm" class="flex flex-col gap-3">
                            <input type="text" id="comCatName" required class="glass-input rounded-lg p-2 text-sm" placeholder="Ex: Doces">
                            <button type="submit" id="btnComCat" class="bg-black/5 dark:bg-white/5 hover:bg-pinkAccent dark:hover:bg-pinkAccent hover:text-white font-bold py-2 rounded-lg text-sm">Salvar Categoria</button>
                            <button type="button" id="btnCancelComCat" class="hidden bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white font-bold py-2 rounded-lg text-sm transition-colors">Cancelar</button>
                        </form>
                        <div id="comCatList" class="mt-4 flex flex-col gap-2 text-sm"></div>
                    </div>
                    <div class="lg:col-span-2">
                        <h3 class="font-bold mb-4 flex items-center text-pinkAccent"><i data-lucide="store" class="w-5 h-5 mr-2"></i> Loja / Serviço</h3>
                        <form id="comForm" class="space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="comTitle" required class="glass-input rounded-lg p-2 text-sm" placeholder="Nome da Loja">
                                <select id="comCategory" required class="glass-input rounded-lg p-2 text-sm [&>option]:bg-white dark:[&>option]:bg-[#050505]"></select>
                            </div>
                            <input type="url" id="comImg" class="w-full glass-input rounded-lg p-2 text-sm" placeholder="URL da Imagem">
                            <textarea id="comDesc" required class="w-full glass-input rounded-lg p-2 text-sm" rows="2" placeholder="O que vende?"></textarea>
                            
                            <div class="flex gap-4 bg-black/5 dark:bg-white/5 p-2 rounded-lg">
                                <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="comType" value="link" checked class="mr-2 accent-pinkAccent" onchange="togglePostType('com')"> Link Externo</label>
                                <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="comType" value="blog" class="mr-2 accent-pinkAccent" onchange="togglePostType('com')"> Cardápio Interno</label>
                            </div>
                            
                            <div id="comLinkWrapper"><input type="url" id="comLink" class="w-full glass-input rounded-lg p-2 text-sm" placeholder="https://instagram.com/..."></div>

            <div id="calendarTab" class="tab-content hidden">
                <div class="max-w-2xl mx-auto">
                    <h3 class="font-bold mb-4 flex items-center text-purpleAccent"><i data-lucide="calendar-plus" class="w-5 h-5 mr-2"></i> Criar Evento Acadêmico</h3>
                    <form id="evtForm" class="space-y-4">
                        <input type="text" id="evtTitle" required class="w-full glass-input rounded-lg p-3" placeholder="Título do Evento">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-xs font-bold text-themeMuted block mb-1">Início</label><input type="date" id="evtStart" required class="w-full glass-input rounded-lg p-3"></div>
                            <div><label class="text-xs font-bold text-themeMuted block mb-1">Fim</label><input type="date" id="evtEnd" required class="w-full glass-input rounded-lg p-3"></div>
                        </div>
                        <div><label class="text-xs font-bold text-themeMuted block mb-1">Ícone Pequeno no Dia (Opcional PNG/URL)</label><input type="url" id="evtIcon" class="w-full glass-input rounded-lg p-3" placeholder="https://..."></div>
                        <div class="flex gap-2 pt-2">

                        </div>
                    </form>
                    <div class="mt-8 pt-6 border-t border-[var(--glass-border)]">
                        <h4 class="font-bold text-themeMuted mb-4">Eventos Criados</h4>

        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        window.setTheme = function(mode) { localStorage.setItem('theme', mode); updateTheme(); };
        function updateTheme() {
            const mode = localStorage.getItem('theme') || 'system';
            if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyA91S9TJQ-YhfKPrvXMBVwaop6cwfmPLIc", authDomain: "acervif12.firebaseapp.com", projectId: "acervif12", appId: "1:698647384488:web:c45b99428d9767fe04cd9d" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active', 'border-purpleAccent', 'text-purpleAccent'); b.classList.add('border-transparent'); });
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                btn.classList.add('active', 'border-purpleAccent', 'text-purpleAccent');
                btn.classList.remove('border-transparent');
                document.getElementById(btn.dataset.target).classList.remove('hidden');
            });
        });

        window.togglePostType = (prefix) => {
            const isBlog = document.querySelector(`input[name="${prefix}Type"]:checked`).value === 'blog';
            document.getElementById(`${prefix}LinkWrapper`).classList.toggle('hidden', isBlog);
            document.getElementById(`${prefix}BlogWrapper`).classList.toggle('hidden', !isBlog);
            if(isBlog) document.getElementById(`${prefix}Link`).value = '';
        };

        let dbPosts = [], dbCats = [], dbCom = [], dbComCats = [], dbEvts = [];
        let editId = { cat: null, post: null, comCat: null, com: null, evt: null };

        onAuthStateChanged(auth, async (user) => {
            if (user) { document.getElementById('loginSection').classList.add('hidden'); document.getElementById('adminSection').classList.remove('hidden'); await loadAllData(); } 
            else { document.getElementById('loginSection').classList.remove('hidden'); document.getElementById('adminSection').classList.add('hidden'); }
            lucide.createIcons();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value); } catch (e) { alert('Credenciais Inválidas'); } });
        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        function showStatus(msg, type='success') {
            const el = document.getElementById('statusMessage');
            el.innerText = msg;
            el.className = `mb-6 p-4 rounded-xl font-mono text-sm font-bold border block ${type==='success'?'border-green-500 text-green-700 bg-green-500/10':'border-red-500 text-red-700 bg-red-500/10'}`;
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function loadAllData() {
            const qc = await getDocs(query(collection(db, 'categories'), orderBy('name'))); dbCats = qc.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('catList').innerHTML = dbCats.map(c => `<div class="glass-panel p-2 flex justify-between rounded text-textMain"><span>${c.name}</span><div><button class="text-cyanAccent mr-2" onclick="editData('cat','${c.id}')"><i data-lucide="edit-2" class="w-4 h-4"></i></button><button class="text-red-500" onclick="deleteData('categories','${c.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`).join('');
            document.getElementById('postCategory').innerHTML = dbCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            
            const qp = await getDocs(query(collection(db, 'posts'), orderBy('createdAt', 'desc'))); dbPosts = qp.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('adminPostList').innerHTML = dbPosts.map(p => `<tr><td class="p-3 font-bold text-textMain">${p.title}</td><td class="p-3 text-cyanAccent font-mono text-xs">${p.postType==='blog'?'Blog':'Link'}</td><td class="p-3 text-right"><button class="text-cyanAccent mr-3" onclick="editData('post','${p.id}')"><i data-lucide="edit-2" class="w-4 h-4 inline"></i></button><button class="text-red-500" onclick="deleteData('posts','${p.id}')"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button></td></tr>`).join('');

            const qcc = await getDocs(query(collection(db, 'comercioCategories'), orderBy('name'))); dbComCats = qcc.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('comCatList').innerHTML = dbComCats.map(c => `<div class="glass-panel p-2 flex justify-between rounded text-textMain"><span>${c.name}</span><div><button class="text-pinkAccent mr-2" onclick="editData('comCat','${c.id}')"><i data-lucide="edit-2" class="w-4 h-4"></i></button><button class="text-red-500" onclick="deleteData('comercioCategories','${c.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`).join('');
            document.getElementById('comCategory').innerHTML = dbComCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            const qc2 = await getDocs(query(collection(db, 'comercios'), orderBy('createdAt', 'desc'))); dbCom = qc2.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('adminComList').innerHTML = dbCom.map(p => `<tr><td class="p-3 font-bold text-textMain">${p.title}</td><td class="p-3 text-pinkAccent font-mono text-xs">${p.postType==='blog'?'Blog':'Link'}</td><td class="p-3 text-right"><button class="text-pinkAccent mr-3" onclick="editData('com','${p.id}')"><i data-lucide="edit-2" class="w-4 h-4 inline"></i></button><button class="text-red-500" onclick="deleteData('comercios','${p.id}')"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button></td></tr>`).join('');

            const qe = await getDocs(query(collection(db, 'events'), orderBy('startDate'))); dbEvts = qe.docs.map(d => ({id: d.id, ...d.data()}));
            document.getElementById('adminEvtList').innerHTML = dbEvts.map(e => `<div class="glass-panel p-3 flex justify-between items-center rounded-lg text-textMain"><div><div class="font-bold">${e.title}</div><div class="text-xs font-mono text-themeMuted">${e.startDate} a ${e.endDate}</div></div><div><button class="text-purpleAccent mr-3" onclick="editData('evt','${e.id}')"><i data-lucide="edit-2" class="w-4 h-4 inline"></i></button><button class="text-red-500" onclick="deleteData('events','${e.id}')"><i data-lucide="trash-2" class="w-4 h-4 inline"></i></button></div></div>`).join('');
            
            lucide.createIcons();
        }

        document.getElementById('catForm').addEventListener('submit', async e => { e.preventDefault(); await saveDoc('categories', {name: document.getElementById('catName').value}, editId.cat); document.getElementById('catForm').reset(); editId.cat=null; document.getElementById('btnCancelCat').classList.add('hidden'); });
        document.getElementById('comCatForm').addEventListener('submit', async e => { e.preventDefault(); await saveDoc('comercioCategories', {name: document.getElementById('comCatName').value}, editId.comCat); document.getElementById('comCatForm').reset(); editId.comCat=null; document.getElementById('btnCancelComCat').classList.add('hidden'); });
        
        document.getElementById('postForm').addEventListener('submit', async e => {
            e.preventDefault(); const pType = document.querySelector('input[name="postType"]:checked').value;
            await saveDoc('posts', { title: document.getElementById('postTitle').value, categoryId: document.getElementById('postCategory').value, description: document.getElementById('postDesc').value, imageUrl: document.getElementById('postImg').value, postType: pType, redirectUrl: pType==='link'?document.getElementById('postLink').value:'', blogContent: pType==='blog'?document.getElementById('postBlogContent').value:'', isPriority: document.getElementById('postPriority').checked, createdAt: editId.post ? undefined : serverTimestamp() }, editId.post);
            document.getElementById('postForm').reset(); editId.post=null; togglePostType('post'); document.getElementById('btnCancelPost').classList.add('hidden');
        });

        document.getElementById('comForm').addEventListener('submit', async e => {
            e.preventDefault(); const pType = document.querySelector('input[name="comType"]:checked').value;
            await saveDoc('comercios', { title: document.getElementById('comTitle').value, categoryId: document.getElementById('comCategory').value, description: document.getElementById('comDesc').value, imageUrl: document.getElementById('comImg').value, postType: pType, redirectUrl: pType==='link'?document.getElementById('comLink').value:'', blogContent: pType==='blog'?document.getElementById('comBlogContent').value:'', createdAt: editId.com ? undefined : serverTimestamp() }, editId.com);
            document.getElementById('comForm').reset(); editId.com=null; togglePostType('com'); document.getElementById('btnCancelCom').classList.add('hidden');
        });

        document.getElementById('evtForm').addEventListener('submit', async e => {
            e.preventDefault(); await saveDoc('events', { title: document.getElementById('evtTitle').value, startDate: document.getElementById('evtStart').value, endDate: document.getElementById('evtEnd').value, iconUrl: document.getElementById('evtIcon').value, type: 'admin', color: '#7C3AED' }, editId.evt);
            document.getElementById('evtForm').reset(); editId.evt=null; document.getElementById('btnCancelEvt').classList.add('hidden');
        });

        document.getElementById('btnCancelCat').onclick = () => { editId.cat=null; document.getElementById('catForm').reset(); document.getElementById('btnCancelCat').classList.add('hidden'); };
        document.getElementById('btnCancelComCat').onclick = () => { editId.comCat=null; document.getElementById('comCatForm').reset(); document.getElementById('btnCancelComCat').classList.add('hidden'); };
        document.getElementById('btnCancelPost').onclick = () => { editId.post=null; document.getElementById('postForm').reset(); document.getElementById('btnCancelPost').classList.add('hidden'); togglePostType('post'); };
        document.getElementById('btnCancelCom').onclick = () => { editId.com=null; document.getElementById('comForm').reset(); document.getElementById('btnCancelCom').classList.add('hidden'); togglePostType('com'); };
        document.getElementById('btnCancelEvt').onclick = () => { editId.evt=null; document.getElementById('evtForm').reset(); document.getElementById('btnCancelEvt').classList.add('hidden'); };

        async function saveDoc(col, data, id) { try { if(id) { delete data.createdAt; await updateDoc(doc(db, col, id), data); } else await addDoc(collection(db, col), data); showStatus('Sucesso!'); await loadAllData(); } catch(e) { console.error(e); showStatus('Erro ao salvar.', 'error'); } }
        window.deleteData = async (col, id) => { if(!confirm('Tem certeza que deseja deletar?')) return; await deleteDoc(doc(db, col, id)); showStatus('Deletado com sucesso'); await loadAllData(); }

        window.editData = (type, id) => {
            if(type==='cat') { const d = dbCats.find(c=>c.id===id); document.getElementById('catName').value=d.name; editId.cat=id; document.getElementById('btnCancelCat').classList.remove('hidden'); }
            if(type==='comCat') { const d = dbComCats.find(c=>c.id===id); document.getElementById('comCatName').value=d.name; editId.comCat=id; document.getElementById('btnCancelComCat').classList.remove('hidden'); }
            if(type==='post') { 
                const d = dbPosts.find(p=>p.id===id); editId.post=id; document.getElementById('postTitle').value=d.title; document.getElementById('postCategory').value=d.categoryId; document.getElementById('postDesc').value=d.description; document.getElementById('postImg').value=d.imageUrl || ''; document.getElementById('postPriority').checked=d.isPriority; document.querySelector(`input[name="postType"][value="${d.postType||'link'}"]`).checked = true;
                if(d.postType==='blog') document.getElementById('postBlogContent').value=d.blogContent||''; else document.getElementById('postLink').value=d.redirectUrl||'';
                togglePostType('post'); document.getElementById('btnCancelPost').classList.remove('hidden'); document.getElementById('postTitle').scrollIntoView();
            }
            if(type==='com') { 
                const d = dbCom.find(p=>p.id===id); editId.com=id; document.getElementById('comTitle').value=d.title; document.getElementById('comCategory').value=d.categoryId; document.getElementById('comDesc').value=d.description; document.getElementById('comImg').value=d.imageUrl || ''; document.querySelector(`input[name="comType"][value="${d.postType||'link'}"]`).checked = true;
                if(d.postType==='blog') document.getElementById('comBlogContent').value=d.blogContent||''; else document.getElementById('comLink').value=d.redirectUrl||'';
                togglePostType('com'); document.getElementById('btnCancelCom').classList.remove('hidden'); document.getElementById('comTitle').scrollIntoView();
            }
            if(type==='evt') {
                const d = dbEvts.find(e=>e.id===id); editId.evt=id; document.getElementById('evtTitle').value=d.title; document.getElementById('evtStart').value=d.startDate; document.getElementById('evtEnd').value=d.endDate; document.getElementById('evtIcon').value=d.iconUrl || '';
                document.getElementById('btnCancelEvt').classList.remove('hidden'); document.getElementById('evtTitle').scrollIntoView();
            }
        }
    </script>
</body>
</html>

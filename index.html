<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcervIF | Repositório Público</title>
    
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/1/15/Logotipo_IFET.svg" type="image/svg+xml">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        themeBg: 'var(--bg-color)', 
                        textMain: 'var(--text-main)',
                        themeMuted: 'var(--text-muted)',
                        cyanAccent: 'var(--cyan-accent)', 
                        purpleAccent: 'var(--purple-accent)', 
                        pinkAccent: 'var(--pink-accent)' 
                    },
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #F8FAFC;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --cyan-accent: #0284C7;
            --purple-accent: #7C3AED;
            --pink-accent: #DB2777;
            
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.05);
            --glass-hover-bg: rgba(255, 255, 255, 0.9);
            --glass-shadow: rgba(0, 0, 0, 0.03);
            
            --input-bg: rgba(255, 255, 255, 0.8);
            --input-border: rgba(0, 0, 0, 0.1);
            --input-focus-bg: #FFFFFF;
            
            --grid-line: rgba(0, 0, 0, 0.04);
            --scroll-track: #F8FAFC;
            --scroll-thumb: #CBD5E1;
            --scroll-thumb-hover: #0284C7;
        }

        .dark {
            --bg-color: #050505;
            --text-main: #FFFFFF;
            --text-muted: #A1A1AA;
            --cyan-accent: #00F0FF;
            --purple-accent: #8A2BE2;
            --pink-accent: #FF1493;
            
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover-bg: rgba(255, 255, 255, 0.03);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            
            --input-bg: rgba(255, 255, 255, 0.03);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus-bg: rgba(255, 255, 255, 0.05);
            
            --grid-line: rgba(255, 255, 255, 0.03);
            --scroll-track: #050505;
            --scroll-thumb: #27272a;
            --scroll-thumb-hover: #00F0FF;
        }

        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
        .bg-grid {
            background-size: 50px 50px;
            background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                              linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: 0 4px 30px var(--glass-shadow); transition: background-color 0.3s, border-color 0.3s; }
        .glass-input { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); transition: all 0.3s ease; }
        .glass-input:focus { outline: none; border-color: var(--cyan-accent); background: var(--input-focus-bg); box-shadow: 0 0 15px rgba(2, 132, 199, 0.15); }
        .dark .glass-input:focus { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        
        .glass-card-hover { transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s, border-color 0.3s, box-shadow 0.3s; position: relative; }
        .glass-card-hover:hover { transform: translateY(-8px); background: var(--glass-hover-bg); box-shadow: 0 20px 40px -15px rgba(2, 132, 199, 0.15); border-color: var(--cyan-accent); }
        .dark .glass-card-hover:hover { box-shadow: 0 20px 40px -15px rgba(0, 240, 255, 0.15); }

        .text-gradient { background: linear-gradient(to right, var(--text-main), var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(5deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased selection:bg-cyanAccent selection:text-white relative pb-20">

    <div class="fixed inset-0 bg-grid -z-20 pointer-events-none transition-colors duration-300"></div>
    <div class="fixed top-[-10%] right-[-5%] w-[600px] h-[600px] bg-cyanAccent rounded-full blur-[180px] opacity-10 pointer-events-none -z-10 animate-float transition-colors duration-500"></div>
    <div class="fixed bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-purpleAccent rounded-full blur-[150px] opacity-[0.08] pointer-events-none -z-10 animate-float transition-colors duration-500" style="animation-delay: 2s;"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 sm:pt-16 relative z-10">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-6 relative z-10 border-b border-[var(--glass-border)] pb-8">
            <div class="flex items-center group cursor-default">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Instituto_Federal_Marca_2015.svg/960px-Instituto_Federal_Marca_2015.svg.png" alt="Logo IFRJ" class="w-12 h-12 mr-4 group-hover:scale-110 transition-transform duration-500 drop-shadow-sm">
                <div>
                    <h1 class="text-3xl sm:text-4xl font-bold tracking-tighter text-gradient leading-none">AcervIF</h1>
                    <p class="font-mono text-sm text-themeMuted mt-1">IFRJ Niterói /// Repositório Público</p>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
                <a href="comercios.html" class="flex items-center gap-2 whitespace-nowrap glass-panel px-5 py-3 rounded-full font-mono text-sm font-bold text-pinkAccent hover:bg-pinkAccent hover:text-white transition-all shadow-sm w-full sm:w-auto justify-center">
                    <i data-lucide="store" class="w-4 h-4"></i> Comércios
                </a>
                <a href="calendario.html" class="flex items-center gap-2 whitespace-nowrap glass-panel px-5 py-3 rounded-full font-mono text-sm font-bold text-purpleAccent hover:bg-purpleAccent hover:text-white transition-all shadow-sm w-full sm:w-auto justify-center">
                    <i data-lucide="calendar-days" class="w-4 h-4"></i> Calendário
                </a>
                <a href="fluxograma.html" class="flex items-center gap-2 whitespace-nowrap glass-panel px-5 py-3 rounded-full font-mono text-sm font-bold text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white transition-all shadow-sm flex-1 sm:flex-none justify-center">
                    <i data-lucide="git-branch" class="w-4 h-4"></i> Fluxogramas
                </a>
                
                <div class="relative w-full md:w-64">
                    <input type="text" id="searchInput" placeholder="Buscar algoritmos..." class="w-full glass-input rounded-full py-3 pl-12 pr-4 font-mono text-sm">
                    <i data-lucide="search" class="absolute left-4 top-3.5 w-5 h-5 text-themeMuted"></i>
                </div>

                <!-- Botão Seletor de Tema -->
                <div class="relative group z-50">
                    <button class="glass-panel p-3 rounded-full text-themeMuted hover:text-textMain transition-all flex items-center justify-center w-11 h-11 shadow-sm">
                        <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                        <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                    </button>
                    <div class="absolute right-0 mt-2 w-36 glass-panel rounded-xl py-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
                        <button onclick="setTheme('light')" class="w-full text-left px-4 py-2 text-sm font-mono text-themeMuted hover:text-textMain hover:bg-black/5 dark:hover:bg-white/5 flex items-center"><i data-lucide="sun" class="w-4 h-4 mr-2"></i> Claro</button>
                        <button onclick="setTheme('dark')" class="w-full text-left px-4 py-2 text-sm font-mono text-themeMuted hover:text-textMain hover:bg-black/5 dark:hover:bg-white/5 flex items-center"><i data-lucide="moon" class="w-4 h-4 mr-2"></i> Escuro</button>
                        <button onclick="setTheme('system')" class="w-full text-left px-4 py-2 text-sm font-mono text-themeMuted hover:text-textMain hover:bg-black/5 dark:hover:bg-white/5 flex items-center"><i data-lucide="monitor" class="w-4 h-4 mr-2"></i> Sistema</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex space-x-3 overflow-x-auto pb-6 mb-8 scrollbar-hide relative z-10" id="categoriesContainer"></div>

        <div id="loader" class="text-center py-20 font-mono text-cyanAccent animate-pulse hidden">
            Acessando banco de dados do núcleo...
        </div>

        <div id="emptyState" class="glass-panel rounded-3xl p-12 text-center max-w-2xl mx-auto mt-20 hidden relative z-10">
            <i data-lucide="shield-alert" class="w-12 h-12 text-themeMuted mx-auto mb-4"></i>
            <h3 class="text-xl font-bold text-textMain mb-2">Acervo Vazio ou Não Encontrado</h3>
            <p class="text-themeMuted font-mono text-sm">Nenhum registro encontrado para esta busca.</p>
        </div>

        <div id="prioritySection" class="mb-16 hidden relative z-10">
            <div class="flex items-center mb-6">
                <div class="w-2 h-2 rounded-full bg-cyanAccent animate-ping mr-3"></div>
                <h2 class="text-2xl font-bold text-textMain">Em Destaque</h2>
            </div>
            <div id="priorityGrid" class="grid gap-6"></div>
        </div>

        <div id="regularSection" class="hidden relative z-10">
            <h2 class="text-2xl font-bold mb-6 text-themeMuted">Acervo Cronológico</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="regularGrid"></div>
        </div>
    </div>

    <div id="blogModal" class="fixed inset-0 z-50 hidden bg-white/90 dark:bg-[#050505]/95 backdrop-blur-xl overflow-y-auto pt-10 pb-20 px-4 sm:px-8 transition-colors duration-300">
        <div class="max-w-4xl mx-auto bg-themeBg rounded-3xl overflow-hidden relative shadow-2xl border border-[var(--glass-border)]">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-black/10 dark:bg-white/10 p-3 rounded-full text-textMain hover:text-cyanAccent hover:scale-110 transition-all z-10 shadow-md">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <img id="modalImg" class="w-full h-64 md:h-96 object-cover border-b border-[var(--glass-border)]" src="" alt="Capa">
            <div class="p-8 md:p-12">
                <div class="flex items-center gap-3 mb-6">
                    <span id="modalCategory" class="text-xs font-mono text-white bg-cyanAccent px-3 py-1 rounded-full font-bold"></span>
                    <span id="modalDate" class="text-xs font-mono text-themeMuted"></span>
                </div>
                <h2 id="modalTitle" class="text-3xl md:text-5xl font-bold text-textMain mb-6 leading-tight"></h2>
                <p id="modalDesc" class="text-xl md:text-2xl text-cyanAccent font-light mb-10 border-l-4 border-cyanAccent pl-4"></p>
                <div id="modalContent" class="text-slate-700 dark:text-slate-300 leading-relaxed font-sans text-lg whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        window.setTheme = function(mode) {
            localStorage.setItem('theme', mode);
            updateTheme();
        };

        function updateTheme() {
            const mode = localStorage.getItem('theme') || 'system';
            if (mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme);
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA91S9TJQ-YhfKPrvXMBVwaop6cwfmPLIc",
            authDomain: "acervif12.firebaseapp.com",
            projectId: "acervif12",
            storageBucket: "acervif12.firebasestorage.app",
            messagingSenderId: "698647384488",
            appId: "1:698647384488:web:c45b99428d9767fe04cd9d",
            measurementId: "G-9C095VDTBG"
        };

        let db;
        let allPosts = [];
        let allCategories = [];
        let activeCategory = 'Todas';

        const searchInput = document.getElementById('searchInput');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const prioritySection = document.getElementById('prioritySection');
        const regularSection = document.getElementById('regularSection');
        const priorityGrid = document.getElementById('priorityGrid');
        const regularGrid = document.getElementById('regularGrid');

        async function init() {
            lucide.createIcons();
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                await fetchData();
            } catch (error) {
                console.error("Erro Firebase:", error);
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        async function fetchData() {
            document.getElementById('loader').classList.remove('hidden');
            try {
                const catQuery = query(collection(db, 'categories'), orderBy('name'));
                const catSnapshot = await getDocs(catQuery);
                allCategories = catSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const postQuery = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
                const postSnapshot = await getDocs(postQuery);
                allPosts = postSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                renderCategories();
                filterAndRenderPosts();
            } catch (error) {
                console.error("Erro dados:", error);
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function renderCategories() {
            categoriesContainer.innerHTML = '';
            const btnAll = document.createElement('button');
            btnAll.className = `px-6 py-2 rounded-full font-mono text-sm font-semibold whitespace-nowrap transition-all duration-300 ${activeCategory === 'Todas' ? 'bg-cyanAccent text-white shadow-md' : 'glass-panel text-themeMuted hover:text-textMain hover:bg-black/5 dark:hover:bg-white/5'}`;
            btnAll.innerText = '[Todas]';
            btnAll.onclick = () => { activeCategory = 'Todas'; renderCategories(); filterAndRenderPosts(); };
            categoriesContainer.appendChild(btnAll);

            allCategories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `px-6 py-2 rounded-full font-mono text-sm font-semibold whitespace-nowrap transition-all duration-300 ${activeCategory === cat.id ? 'bg-cyanAccent text-white shadow-md' : 'glass-panel text-themeMuted hover:text-textMain hover:bg-black/5 dark:hover:bg-white/5'}`;
                btn.innerText = cat.name;
                btn.onclick = () => { activeCategory = cat.id; renderCategories(); filterAndRenderPosts(); };
                categoriesContainer.appendChild(btn);
            });
        }

        function filterAndRenderPosts() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = allPosts.filter(post => {
                const matchesSearch = post.title.toLowerCase().includes(searchTerm) || post.description.toLowerCase().includes(searchTerm);
                const matchesCategory = activeCategory === 'Todas' || post.categoryId === activeCategory;
                return matchesSearch && matchesCategory;
            });

            if (filtered.length === 0) {
                prioritySection.classList.add('hidden'); regularSection.classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden'); return;
            }

            document.getElementById('emptyState').classList.add('hidden');
            const priority = filtered.filter(p => p.isPriority);
            const regular = filtered.filter(p => !p.isPriority);

            // Dinâmica dos Destaques Cinemáticos
            if (priority.length > 0) {
                if (priority.length === 1) {
                    priorityGrid.className = "grid grid-cols-1 gap-6";
                    priorityGrid.innerHTML = priority.map(p => createFullBleedHTML(p, 'h-[400px] md:h-[500px]')).join('');
                } else if (priority.length === 2) {
                    priorityGrid.className = "grid grid-cols-1 md:grid-cols-2 gap-6";
                    priorityGrid.innerHTML = priority.map(p => createFullBleedHTML(p, 'h-[350px] md:h-[450px]')).join('');
                } else {
                    priorityGrid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
                    priorityGrid.innerHTML = priority.map(p => createStandardHTML(p)).join('');
                }
                prioritySection.classList.remove('hidden');
            } else {
                prioritySection.classList.add('hidden');
            }

            if (regular.length > 0) {
                regularGrid.innerHTML = regular.map(p => createStandardHTML(p)).join('');
                regularSection.classList.remove('hidden');
            } else {
                regularSection.classList.add('hidden');
            }

            lucide.createIcons();
        }

        function createFullBleedHTML(post, heightClass) {
            const catName = allCategories.find(c => c.id === post.categoryId)?.name || 'Geral';
            let dateStr = post.createdAt?.toDate().toLocaleDateString('pt-BR') || 'Recente';
            const defaultImg = 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=800';
            
            const isBlog = post.postType === 'blog';
            const actionTag = isBlog ? `<div onclick="openModal('${post.id}')"` : `<a href="${post.redirectUrl}" target="_blank" rel="noopener"`;
            const closeTag = isBlog ? `</div>` : `</a>`;

            return `
                ${actionTag} class="relative w-full ${heightClass} rounded-3xl overflow-hidden group cursor-pointer block shadow-lg border border-[var(--glass-border)]">
                    <img src="${post.imageUrl || defaultImg}" alt="${post.title}" class="absolute inset-0 w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-1000" onerror="this.src='${defaultImg}'">
                    
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-10"></div>
                    
                    ${isBlog ? '<div class="absolute top-4 right-4 z-20 bg-black/40 backdrop-blur-md px-4 py-2 rounded-full text-xs font-mono text-white border border-white/30 flex items-center shadow-lg"><i data-lucide="align-left" class="w-4 h-4 mr-2"></i> Postagem Interna</div>' : ''}

                    <div class="absolute bottom-0 left-0 w-full p-8 md:p-10 z-20 flex flex-col justify-end h-full">
                        <div class="mb-4"><span class="text-xs font-mono text-themeBg bg-cyanAccent px-3 py-1 rounded-full font-bold shadow-md">${catName}</span></div>
                        <h3 class="text-3xl md:text-4xl font-bold text-white group-hover:text-cyanAccent transition-colors leading-tight mb-3 drop-shadow-md">${post.title}</h3>
                        <p class="text-slate-300 text-sm md:text-base leading-relaxed line-clamp-2 md:line-clamp-3 mb-4 max-w-3xl">${post.description}</p>
                        <div class="flex items-center text-sm font-mono text-slate-400">
                            <i data-lucide="calendar" class="w-4 h-4 mr-2"></i> ${dateStr}
                            ${!isBlog ? '<i data-lucide="external-link" class="w-4 h-4 ml-4 opacity-0 group-hover:opacity-100 transition-opacity"></i>' : ''}
                        </div>
                    </div>
                ${closeTag}
            `;
        }

        function createStandardHTML(post) {
            const catName = allCategories.find(c => c.id === post.categoryId)?.name || 'Geral';
            let dateStr = post.createdAt?.toDate().toLocaleDateString('pt-BR') || 'Recente';
            const defaultImg = 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=800';
            
            const isBlog = post.postType === 'blog';
            const actionTag = isBlog ? `<div onclick="openModal('${post.id}')"` : `<a href="${post.redirectUrl}" target="_blank" rel="noopener"`;
            const closeTag = isBlog ? `</div>` : `</a>`;

            return `
                ${actionTag} class="glass-panel glass-card-hover rounded-3xl overflow-hidden flex flex-col group p-2 h-full cursor-pointer block">
                    <div class="relative h-48 rounded-2xl overflow-hidden border border-[var(--glass-border)]">
                        <div class="absolute inset-0 bg-black/10 dark:bg-white/10 group-hover:bg-transparent transition-colors duration-500 z-10"></div>
                        <img src="${post.imageUrl || defaultImg}" alt="${post.title}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700" onerror="this.src='${defaultImg}'">
                        ${isBlog ? '<div class="absolute top-3 right-3 z-20 bg-themeBg/80 px-3 py-1 rounded-full text-xs font-mono text-cyanAccent backdrop-blur-sm border border-[var(--glass-border)] flex items-center shadow-sm"><i data-lucide="align-left" class="w-3 h-3 mr-1"></i> Ler</div>' : ''}
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <div class="flex items-start justify-between mb-3">
                            <h3 class="text-xl font-bold text-textMain group-hover:text-cyanAccent transition-colors leading-tight">${post.title}</h3>
                            <i data-lucide="${isBlog ? 'book-open' : 'external-link'}" class="w-5 h-5 text-themeMuted opacity-0 group-hover:opacity-100 group-hover:translate-x-1 -group-hover:translate-y-1 transition-all flex-shrink-0 ml-2"></i>
                        </div>
                        <p class="text-themeMuted text-sm mb-6 flex-grow leading-relaxed line-clamp-3">${post.description}</p>
                        <div class="flex items-center justify-between mt-auto pt-4 border-t border-[var(--glass-border)]">
                            <span class="text-xs font-mono text-cyanAccent bg-cyanAccent/10 px-3 py-1 rounded-full">${catName}</span>
                            <span class="flex items-center text-xs font-mono text-themeMuted"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${dateStr}</span>
                        </div>
                    </div>
                ${closeTag}
            `;
        }

        window.openModal = (id) => {
            const post = allPosts.find(p => p.id === id);
            if(!post) return;
            document.getElementById('modalImg').src = post.imageUrl || '';
            document.getElementById('modalTitle').innerText = post.title;
            document.getElementById('modalDesc').innerText = post.description;
            document.getElementById('modalContent').innerText = post.blogContent || '';
            document.getElementById('modalCategory').innerText = allCategories.find(c => c.id === post.categoryId)?.name || 'Geral';
            document.getElementById('modalDate').innerText = post.createdAt?.toDate().toLocaleDateString('pt-BR') || 'Recente';
            
            document.getElementById('blogModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        };

        window.closeModal = () => {
            document.getElementById('blogModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        };

        searchInput.addEventListener('input', filterAndRenderPosts);
        init();
    </script>
</body>
</html>

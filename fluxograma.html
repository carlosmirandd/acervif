    }

    body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; transition: background-color 0.3s, color 0.3s; }

    .text-gradient { 
        background: linear-gradient(to right, var(--text-main), var(--text-muted)); 
        -webkit-background-clip: text; 
        background-clip: text;
        -webkit-text-fill-color: transparent; 
    }

    ::-webkit-scrollbar { width: 8px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }

    .card-subject { transition: opacity 0.3s ease, transform 0.2s, box-shadow 0.2s; position: relative; }

    .kanban-scroll::-webkit-scrollbar { height: 12px; }
    .kanban-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
    .dark .kanban-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }

                    { nome: "Métodos Apoio Decisão", cred: 4, ch: 54, tipo: "T/P", nucleo: "espec" },
                    { nome: "Proj. Int. Extensão II", cred: 4, ch: 54, tipo: "E", nucleo: "ext" },
                    { nome: "Direito do Trabalho", cred: 2, ch: 27, tipo: "T", nucleo: "prof" },
                    { nome: "Controle Estatístico Proc.", cred: 2, ch: 27, tipo: "T/P", nucleo: "prof" },
                    { nome: "Big Data e Data Science", cred: 4, ch: 54, tipo: "T/P", nucleo: "espec" },
                    { nome: "Projeto do Produto", cred: 2, ch: 27, tipo: "T/P", nucleo: "prof" }
                ],
                [
                    { nome: "Gestão de Projetos", cred: 4, ch: 54, tipo: "T/P", nucleo: "prof" },
                    { nome: "Proj. Sistema Produção II", cred: 4, ch: 54, tipo: "E", nucleo: "ext" },
                    { nome: "Planej. e Controle Prod.", cred: 4, ch: 54, tipo: "T/P", nucleo: "prof" },
                    { nome: "Gestão da Qualidade", cred: 4, ch: 54, tipo: "T/P", nucleo: "prof" },
                    { nome: "Proj. Sistema Produção III", cred: 4, ch: 54, tipo: "E", nucleo: "ext" },
                    { nome: "Optativa I", cred: 2, ch: 27, tipo: "T/P", nucleo: "opt" }
                ],
                [
                    { nome: "Gestão da Inovação", cred: 2, ch: 27, tipo: "T/P", nucleo: "espec" },
                    { nome: "Optativa II", cred: 4, ch: 54, tipo: "T/P", nucleo: "opt" },
                    { nome: "Optativa III", cred: 2, ch: 27, tipo: "T/P", nucleo: "opt" },
                    { nome: "Estágio Supervisionado I", cred: 0, ch: 162, tipo: "P", nucleo: "estagio" },
                    { nome: "Estágio Supervisionado II", cred: 0, ch: 162, tipo: "P", nucleo: "estagio" },
                    { nome: "Trabalho Conclusão I", cred: 2, ch: 27, tipo: "P", nucleo: "estagio" },
                    { nome: "Trabalho Conclusão II", cred: 2, ch: 27, tipo: "P", nucleo: "estagio" }
                ]
            ]
        }
    };

    let currentCourse = 'computacao';
    let currentFilter = 'todos';

    function initFluxograma() { renderLegend(); renderStats(); renderBoard(); }

    function renderLegend() {
        const container = document.getElementById('legendContainer');
        container.innerHTML = filtros.map(f => {
            const isActive = currentFilter === f.id;
            const activeClasses = isActive ? 'ring-2 ring-offset-2 ring-black dark:ring-white dark:ring-offset-[#050505] scale-105 shadow-md opacity-100' : 'opacity-80 hover:opacity-100 hover:scale-105';
            
            return `
            <button onclick="setFilter('${f.id}')" 
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg border transition-all duration-200 ${f.style.bg} ${f.style.border} ${f.style.text} ${activeClasses}">
                <div class="w-3 h-3 rounded-sm border ${f.style.border} bg-white/50"></div>
                <span class="text-xs font-bold font-mono tracking-tight">${f.label}</span>
            </button>
        `}).join('');
    }

    function setFilter(id) { currentFilter = id; renderLegend(); renderBoard(); }

    function selectCourse(course) {
        currentCourse = course;
        const btnComp = document.getElementById('btnComp');
        const btnProd = document.getElementById('btnProd');
        
        if (course === 'computacao') {
            btnComp.className = 'px-6 py-2 rounded-lg font-bold font-mono text-sm transition-all bg-emerald-500 text-white shadow-md';
            btnProd.className = 'px-6 py-2 rounded-lg font-bold font-mono text-sm transition-all text-slate-600 dark:text-slate-300 hover:text-black dark:hover:text-white';
        } else {
            btnProd.className = 'px-6 py-2 rounded-lg font-bold font-mono text-sm transition-all bg-emerald-500 text-white shadow-md';
            btnComp.className = 'px-6 py-2 rounded-lg font-bold font-mono text-sm transition-all text-slate-600 dark:text-slate-300 hover:text-black dark:hover:text-white';
        }
        renderStats(); renderBoard();
    }

    function renderStats() {
        const data = cursosData[currentCourse];
        document.getElementById('courseTitleDisplay').innerText = data.titulo;
        document.getElementById('courseStats').innerHTML = `
            <div class="flex items-center bg-black/5 dark:bg-white/5 px-4 py-2 rounded-lg border border-black/5 dark:border-white/10 shadow-sm"><i data-lucide="clock" class="w-4 h-4 mr-2 text-emerald-500"></i> ${data.totalHoras} Totais</div>
            <div class="flex items-center px-4 py-2 opacity-80 text-xs text-black dark:text-white">${data.resumo}</div>
        `;
        lucide.createIcons();
    }

    function renderBoard() {
        const data = cursosData[currentCourse];
        const container = document.getElementById('periodsContainer');
        
        let html = '';
        data.periodos.forEach((periodo, index) => {
            let horasPeriodo = periodo.reduce((acc, curr) => acc + curr.ch, 0);
            let credPeriodo = periodo.reduce((acc, curr) => acc + curr.cred, 0);
            
            html += `
                <div class="flex-shrink-0 w-[260px] bg-white/50 dark:bg-[#111111]/80 rounded-2xl border border-black/5 dark:border-white/10 p-3 h-max">
                    <div class="flex justify-between items-center mb-4 px-2 border-b border-black/10 dark:border-white/10 pb-2">
                        <h3 class="font-bold text-sm text-emerald-600 dark:text-emerald-400 font-mono">${index + 1}º Período</h3>
                        <span class="text-xs font-mono text-slate-500 font-bold bg-black/5 dark:bg-white/5 px-2 py-1 rounded-md">${horasPeriodo}h / ${credPeriodo}cr</span>
                    </div>
                    <div class="flex flex-col gap-2.5">
            `;
            
            periodo.forEach(mat => {
                const isActive = currentFilter === 'todos' || currentFilter === mat.nucleo;
                let cardClasses = isActive 
                    ? `${estilosNucleo[mat.nucleo].bg} ${estilosNucleo[mat.nucleo].border} ${estilosNucleo[mat.nucleo].text} border-2`
                    : 'bg-slate-100 dark:bg-black/40 border-black/10 dark:border-white/5 inactive-card text-slate-500';
                
                html += `
                    <div class="rounded-xl p-2.5 text-sm shadow-sm card-subject flex flex-col justify-between min-h-[90px] ${cardClasses}">
                        <div class="flex justify-end mb-1">
                            <span class="text-[10px] font-bold font-mono bg-black/10 dark:bg-white/20 px-1.5 py-0.5 rounded opacity-80 tracking-wider">Tipo: ${mat.tipo}</span>
                        </div>
                        <div class="font-bold leading-tight text-center flex-1 flex items-center justify-center mb-2 px-1 text-[13px]">${mat.nome}</div>
                        <div class="flex justify-between items-center text-[10px] font-mono font-bold opacity-75 border-t border-black/10 dark:border-white/10 pt-1">
                            <span>créditos: ${mat.cred}</span>
                            <span>CH: ${mat.ch}h</span>
                        </div>
                    </div>
                `;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    const slider = document.getElementById('kanbanBoard');
    let isDown = false; let startX; let scrollLeft;

    slider.addEventListener('mousedown', (e) => { isDown = true; startX = e.pageX - slider.offsetLeft; scrollLeft = slider.scrollLeft; });
    slider.addEventListener('mouseleave', () => { isDown = false; });
    slider.addEventListener('mouseup', () => { isDown = false; });
    slider.addEventListener('mousemove', (e) => {
        if(!isDown) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        slider.scrollLeft = scrollLeft - ((x - startX) * 2);
    });

    initFluxograma();
</script>

<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcervIF | Página não encontrada</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon-32.ico" sizes="32x32" type="image/x-icon">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#007A33">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AcervIF">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        const theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        themeBg: 'var(--bg-color)',
                        textMain: 'var(--text-main)',
                        themeMuted: 'var(--text-muted)',
                        cyanAccent: 'var(--cyan-accent)'
                    },
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #F8FAFC; --text-main: #0F172A; --text-muted: #64748B;
            --cyan-accent: #0284C7; --ifrj-green: #007A33; --ifrj-green-light: #009640;
            --glass-bg: rgba(255, 255, 255, 0.7); --glass-border: rgba(0, 0, 0, 0.05); --glass-shadow: rgba(0, 0, 0, 0.03);
        }
        .dark {
            --bg-color: #050505; --text-main: #FFFFFF; --text-muted: #A1A1AA;
            --cyan-accent: #00F0FF; --ifrj-green: #00C853; --ifrj-green-light: #4ADE80;
            --glass-bg: rgba(20, 20, 20, 0.4); --glass-border: rgba(255, 255, 255, 0.08); --glass-shadow: rgba(0, 0, 0, 0.3);
        }
        html { overflow-x: hidden; }
        body { background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        .bg-grid { background-size: 50px 50px; background-image: linear-gradient(to right, rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.04) 1px, transparent 1px); }
        .dark .bg-grid { background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px); }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: 0 4px 30px var(--glass-shadow); }
        .text-gradient { background: linear-gradient(to right, var(--text-main), var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ifrj-topbar { background: linear-gradient(90deg, var(--ifrj-green), var(--ifrj-green-light), var(--cyan-accent)); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center relative px-4">

    <div class="fixed top-0 left-0 w-full h-[3px] ifrj-topbar z-[60] pointer-events-none"></div>
    <div class="fixed inset-0 bg-grid -z-20 pointer-events-none"></div>
    <div class="fixed top-[-10%] right-[-5%] w-[600px] h-[600px] bg-cyanAccent rounded-full blur-[180px] opacity-10 pointer-events-none -z-10"></div>

    <div class="glass-panel rounded-3xl p-10 md:p-14 text-center max-w-lg w-full relative z-10">
        <img src="icons/logoacervif.png" alt="Logo AcervIF" class="w-16 h-16 object-contain mx-auto mb-6">
        <div class="text-6xl font-bold tracking-tighter text-gradient mb-2">404</div>
        <h1 class="text-2xl font-bold text-textMain mb-3">Página não encontrada</h1>
        <p class="text-themeMuted font-mono text-sm mb-8">O endereço que você tentou acessar não existe ou foi movido. Que tal voltar pro acervo?</p>
        <a href="/" class="inline-flex items-center gap-2 bg-cyanAccent text-white font-mono text-sm font-bold px-6 py-3 rounded-full hover:opacity-90 transition-opacity shadow-md">
            <span>Voltar ao AcervIF</span>
        </a>
    </div>

    <p class="relative z-10 mt-8 text-xs font-mono text-themeMuted">AcervIF &mdash; IFRJ Campus Niterói</p>

</body>
</html>
